<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#000000">
    <title>Consultar Nome nos Diários Oficiais</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <h1>Consultar Nome nos Diários Oficiais</h1>

    <div class="results">
        <div class="box">
            <h2>
                DOs Jusbrasil
            </h2>
            <hr>
            <div id="inner-box" class="inner-box">
                <form id="formBuscaDOJB"
                    action="https://www.jusbrasil.com.br/diarios/busca"
                    method="GET" target="_blank" rel="noopener noreferrer">
                    <input type="hidden" name="o" value="data">
                    <input type="hidden" name="p" value="1">
                    <input type="hidden" name="q" value="&quot;Carlos Henrique Araujo Alves&quot;">

                    <button type="submit" id="btnBuscaDOJB">➜] Abrir resultado em nova guia</button>
                </form>
            </div>
        </div>
        <div class="box">
            <h2>
                DOU <small id="dou-total"></small>
                <button id="dou-btn" class="refresh-btn" onclick="consultarDOU()" title="Recarregar">↻</button>
            </h2>
            <hr>
            <div id="dou"></div>
        </div>
        <div class="box">
            <h2>
                DOESP <small id="doesp-total"></small>
                <button id="doesp-btn" class="refresh-btn" onclick="consultarDOESP()" title="Recarregar">↻</button>
            </h2>
            <hr>
            <div id="doesp"></div>
        </div>
        <div class="box">
            <h2>
                DOSP
            </h2>
            <hr>
            <div id="inner-box" class="inner-box">
                <form id="formBuscaDOSP"
                    action="https://diariooficial.prefeitura.sp.gov.br/md_epubli_controlador.php?acao=materias_pesquisar"
                    method="POST" target="_blank" rel="noopener noreferrer">
                    <input type="hidden" name="hdnTermoPesquisa" value="carlos henrique araujo alves">
                    <input type="hidden" name="hdnTipoPesquisa" value="E">
                    <input type="hidden" name="hdnVersaoDiario" value="A">
                    <input type="hidden" name="hdnInicio" value="0">
                    <input type="hidden" name="hdnVisualizacao" value="S">
                    <input type="hidden" name="hdnModoPesquisa" value="RAPIDA">

                    <button type="submit" id="btnBuscaDOSP">➜] Abrir resultado em nova guia</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
